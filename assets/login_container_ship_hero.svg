  <ellipse cx="1160" cy="668" rx="420" ry="12" fill="#081420" fill-opacity="0.55"/>
  <g fill="#e8a35c">
    <rect x="900" y="662" width="10" height="84" rx="4" fill-opacity="0.1"/>
    <rect x="950" y="660" width="6" height="64" rx="3" fill-opacity="0.12"/>
    <rect x="1012" y="663" width="9" height="78" rx="4" fill-opacity="0.09"/>
    <rect x="1080" y="661" width="5" height="56" rx="2.5" fill-opacity="0.11"/>
    <rect x="860" y="665" width="5" height="44" rx="2.5" fill-opacity="0.08"/>
    <rect x="1140" y="664" width="7" height="60" rx="3.5" fill-opacity="0.07"/>
  </g>
  <g fill="#cfe3ea">
