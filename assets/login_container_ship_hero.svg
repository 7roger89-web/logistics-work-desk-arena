    <rect x="784" y="490" width="88" height="34" fill="#2f6d72"/>
    <rect x="874" y="490" width="88" height="34" fill="#8a4f38"/>
    <rect x="964" y="490" width="88" height="34" fill="#47596c"/>
    <rect x="1054" y="490" width="88" height="34" fill="#a8814a"/>
    <rect x="1144" y="490" width="88" height="34" fill="#3d5c74"/>
    <rect x="1234" y="490" width="88" height="34" fill="#39434f"/>
    <rect x="1324" y="490" width="88" height="34" fill="#2f6d72"/>
    <rect x="1414" y="490" width="88" height="34" fill="#7d4038"/>
    <rect x="874" y="456" width="88" height="34" fill="#a8814a"/>
    <rect x="964" y="456" width="88" height="34" fill="#39434f"/>
    <rect x="1054" y="456" width="88" height="34" fill="#7d4038"/>
    <rect x="1144" y="456" width="88" height="34" fill="#8a4f38"/>
    <rect x="1234" y="456" width="88" height="34" fill="#47596c"/>
    <rect x="784" y="556" width="808" height="2.5" fill="#000000" fill-opacity="0.3"/>
