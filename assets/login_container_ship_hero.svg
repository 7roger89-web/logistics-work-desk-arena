  </g>
  <path d="M 387.5 776.5 A 5.5 5.5 0 0 1 389.3 781.5" fill="none" stroke="#58809a" stroke-width="1.2" stroke-opacity="0.7"/>
  <path d="M 384.5 789.5 L 381.5 794.5" stroke="#4a6e85" stroke-width="1" stroke-opacity="0.5"/>

  <!-- tow line: worker hands -> bow -->
  <path d="M 399 809 Q 560 752 713 600" fill="none" stroke="#5d4426" stroke-width="2.5" stroke-opacity="0.5"/>
  <path d="M 398 806 Q 558 748 712 596" fill="none" stroke="#c89a63" stroke-width="5" stroke-linecap="round"/>
  <path d="M 398 806 Q 558 748 712 596" fill="none" stroke="#e6c08a" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- cinematic finish -->
