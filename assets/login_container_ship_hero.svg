  <!-- wake -->
  <path d="M 716 653 L 1600 653" stroke="#9fc0cc" stroke-width="2.5" stroke-opacity="0.35"/>
  <ellipse cx="702" cy="655" rx="30" ry="5" fill="#c8dfe8" fill-opacity="0.28"/>
  <path d="M 720 660 Q 800 668 900 664" fill="none" stroke="#7fa5b4" stroke-width="2" stroke-opacity="0.25"/>

  <!-- mist in front of the hull waterline -->
  <rect x="0" y="592" width="1600" height="78" fill="url(#mistFront)"/>
  <rect x="0" y="548" width="1600" height="44" fill="url(#mistThin)"/>

  <!-- ============ foreground dock ============ -->
  <path d="M 0 796 L 150 788 L 300 784 L 396 788 L 434 806 L 452 848 L 452 900 L 0 900 Z" fill="url(#dock)"/>
  <path d="M 0 796 L 150 788 L 300 784 L 396 788 L 434 806 L 452 848" fill="none" stroke="#22394a" stroke-width="2" stroke-opacity="0.7"/>
  <!-- bollard + coiled line -->
  <rect x="306" y="762" width="14" height="28" rx="4" fill="#0c141d"/>
  <ellipse cx="313" cy="762" rx="7" ry="3.5" fill="#1a2836"/>
  <circle cx="338" cy="790" r="6" fill="none" stroke="#5a452e" stroke-width="2" stroke-opacity="0.8"/>

  <!-- ============ the tiny worker ============ -->
  <ellipse cx="372" cy="831" rx="24" ry="4" fill="#000000" fill-opacity="0.45"/>
  <g stroke="#04070c" fill="none" stroke-linecap="round">
    <path d="M 371 808 L 361 819 L 355 829" stroke-width="4.5"/>
    <path d="M 371 808 L 379 818 L 378 829" stroke-width="4.5"/>
    <path d="M 381 792 L 395 801" stroke-width="4"/>
    <path d="M 380 794 L 398 806" stroke-width="4"/>
    <path d="M 382 789 L 371 808" stroke-width="7"/>
