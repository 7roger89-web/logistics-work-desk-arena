    <rect x="1440" y="720" width="125" height="2.5" rx="1.25" fill-opacity="0.06"/>
    <rect x="1240" y="782" width="150" height="2.5" rx="1.25" fill-opacity="0.05"/>
    <rect x="1490" y="838" width="95" height="2.5" rx="1.25" fill-opacity="0.05"/>
    <rect x="620" y="828" width="115" height="2.5" rx="1.25" fill-opacity="0.05"/>
    <rect x="920" y="748" width="140" height="2.5" rx="1.25" fill-opacity="0.06"/>
    <rect x="1120" y="852" width="130" height="2.5" rx="1.25" fill-opacity="0.05"/>
    <rect x="760" y="690" width="100" height="2.5" rx="1.25" fill-opacity="0.06"/>
    <rect x="1350" y="700" width="90" height="2.5" rx="1.25" fill-opacity="0.05"/>
  </g>

  <!-- mist band behind the ship -->
  <rect x="0" y="598" width="1600" height="40" fill="url(#mistBack)"/>

