<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050c14"/>
      <stop offset="0.45" stop-color="#0a1a27"/>
      <stop offset="0.78" stop-color="#12303c"/>
      <stop offset="1" stop-color="#1a3f4c"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10293a"/>
      <stop offset="0.5" stop-color="#0a1c28"/>
      <stop offset="1" stop-color="#060d15"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e8a35c" stop-opacity="0.5"/>
      <stop offset="0.55" stop-color="#d98f52" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#d98f52" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c3b4a"/>
      <stop offset="0.55" stop-color="#1d2935"/>
      <stop offset="1" stop-color="#141d28"/>
    </linearGradient>
    <linearGradient id="dock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1822"/>
      <stop offset="1" stop-color="#04070b"/>
    </linearGradient>
    <linearGradient id="topFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#030810" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#030810" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mistBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d6e7ee" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#d6e7ee" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#d6e7ee" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mistFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d6e7ee" stop-opacity="0"/>
      <stop offset="0.4" stop-color="#d6e7ee" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#d6e7ee" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mistThin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d6e7ee" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#d6e7ee" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#d6e7ee" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vign" cx="0.5" cy="0.46" r="0.75">
      <stop offset="0" stop-color="#02060a" stop-opacity="0"/>
      <stop offset="0.62" stop-color="#02060a" stop-opacity="0"/>
      <stop offset="1" stop-color="#02060a" stop-opacity="0.55"/>
    </radialGradient>
    <pattern id="corr" width="7" height="12" patternUnits="userSpaceOnUse">
      <rect width="2.4" height="12" fill="#000000" fill-opacity="0.2"/>
    </pattern>
