    <path d="M 792 600 L 1600 597" stroke="#40566b" stroke-width="1.5" stroke-opacity="0.28"/>
    <path d="M 800 624 L 1600 621" stroke="#40566b" stroke-width="1.5" stroke-opacity="0.18"/>
