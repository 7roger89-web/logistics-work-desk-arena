  <ellipse cx="1350" cy="300" rx="200" ry="7" fill="#cfe0ea" fill-opacity="0.035"/>

  <!-- distant shore crane (behind the ship) -->
  <g fill="#0b1622" fill-opacity="0.85">
    <rect x="588" y="478" width="7" height="140"/>
    <rect x="668" y="478" width="7" height="140"/>
    <rect x="588" y="540" width="87" height="5"/>
    <rect x="588" y="500" width="87" height="4"/>
    <rect x="538" y="468" width="185" height="8"/>
    <path d="M 631 440 L 620 468 L 642 468 Z"/>
    <rect x="690" y="476" width="10" height="6"/>
    <rect x="694" y="482" width="3" height="52"/>
    <rect x="684" y="534" width="23" height="5"/>
  </g>
  <path d="M 631 442 L 552 470" stroke="#0b1622" stroke-width="2" stroke-opacity="0.85"/>
  <path d="M 631 442 L 714 470" stroke="#0b1622" stroke-width="2" stroke-opacity="0.85"/>

  <!-- distant crane sliver behind the container stacks -->
  <g fill="#0c1723" fill-opacity="0.8">
