  <g fill="#dceaf2">
    <circle cx="90" cy="60" r="1.4" fill-opacity="0.4"/>
    <circle cx="210" cy="140" r="1.1" fill-opacity="0.3"/>
    <circle cx="330" cy="90" r="1.6" fill-opacity="0.45"/>
    <circle cx="455" cy="180" r="1.1" fill-opacity="0.25"/>
    <circle cx="585" cy="70" r="1.3" fill-opacity="0.35"/>
    <circle cx="700" cy="150" r="1" fill-opacity="0.22"/>
    <circle cx="760" cy="55" r="1.2" fill-opacity="0.3"/>
    <circle cx="905" cy="120" r="1.5" fill-opacity="0.4"/>
    <circle cx="1010" cy="60" r="1.1" fill-opacity="0.28"/>
    <circle cx="1130" cy="170" r="1.2" fill-opacity="0.3"/>
    <circle cx="1250" cy="95" r="1.4" fill-opacity="0.38"/>
    <circle cx="1370" cy="150" r="1" fill-opacity="0.22"/>
    <circle cx="1470" cy="70" r="1.3" fill-opacity="0.32"/>
    <circle cx="1545" cy="190" r="1.1" fill-opacity="0.25"/>
    <circle cx="260" cy="240" r="1" fill-opacity="0.2"/>
    <circle cx="640" cy="260" r="1" fill-opacity="0.18"/>
