    <circle cx="744" cy="580" r="3" fill="#1d2c3a"/>
    <!-- bow mast -->
    <path d="M 772 556 L 772 470" stroke="#22303c" stroke-width="3"/>
    <path d="M 756 486 L 790 480" stroke="#22303c" stroke-width="2.5"/>
    <circle cx="772" cy="466" r="2" fill="#ffd9a0" fill-opacity="0.8"/>
  </g>

