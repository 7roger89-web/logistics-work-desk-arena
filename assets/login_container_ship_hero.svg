  <rect x="784" y="524" width="808" height="34" fill="url(#corr)"/>
  <rect x="784" y="490" width="718" height="34" fill="url(#corr)"/>
  <rect x="874" y="456" width="448" height="34" fill="url(#corr)"/>
  <rect x="784" y="524" width="808" height="2" fill="#ffffff" fill-opacity="0.05"/>
  <rect x="784" y="490" width="718" height="2" fill="#ffffff" fill-opacity="0.05"/>
  <rect x="874" y="456" width="448" height="2" fill="#ffffff" fill-opacity="0.06"/>

  <!-- accommodation block -->
  <g>
    <rect x="1372" y="336" width="102" height="222" fill="#d7dde4"/>
    <rect x="1372" y="336" width="10" height="222" fill="#aeb9c4"/>
    <rect x="1366" y="328" width="114" height="10" fill="#c3ccd4"/>
    <rect x="1382" y="352" width="82" height="9" fill="#16222e"/>
    <rect x="1382" y="382" width="82" height="9" fill="#16222e"/>
    <rect x="1382" y="412" width="82" height="9" fill="#16222e"/>
    <rect x="1382" y="442" width="82" height="9" fill="#16222e"/>
    <rect x="1382" y="472" width="82" height="9" fill="#16222e"/>
    <rect x="1414" y="512" width="18" height="46" fill="#8f9aa5"/>
    <rect x="1398" y="292" width="40" height="36" rx="4" fill="#232f3b"/>
    <rect x="1398" y="300" width="40" height="8" fill="#8a3a30"/>
