function deriveStatusOnSave(taskId, def, prevStatus, values, files) {
  // 1. SI_VGM guard: Đã gửi hãng tàu != Hãng tàu chấp nhận
  if (taskId === "sv-si") {
    if (values.siStatus === "SENT") {
      return {
        status: "doing",
        guardMessage: "Đã lưu trạng thái 'Đã gửi hãng tàu' — CHƯA phải 'Hãng tàu chấp nhận' (SI chưa hoàn tất)"
      };
    }
    if (values.siStatus === "RECEIVED") {
      return {
        status: "waiting",
        guardMessage: "Đã lưu trạng thái 'Đã nhận SI từ khách' — chờ gửi hãng tàu"
      };
    }
    if (values.siStatus === "ACCEPTED" && (!values.siCutoff || !values.acceptedAt || files.length === 0)) {
      return {
        status: "doing",
        guardMessage: "Đã chọn 'Hãng tàu chấp nhận' nhưng còn thiếu thời điểm chấp nhận hoặc tệp bằng chứng"
      };
    }
  }
  if (taskId === "sv-vgm") {
    if (values.vgmStatus === "SENT") {
      return {
        status: "doing",
        guardMessage: "Đã lưu trạng thái 'Đã gửi hãng tàu' — CHƯA phải 'Hãng tàu chấp nhận' (VGM chưa hoàn tất)"
      };
    }
    if (values.vgmStatus === "RECEIVED") {
      return {
        status: "waiting",
        guardMessage: "Đã lưu trạng thái 'Đã thu nhận VGM' — chờ gửi hãng tàu"
      };
    }
  }

  // 2. CUSTOMS IMPORT guard: Có số tờ khai != Đã thông quan
  if (taskId === "ci-decl" || taskId === "ce-decl") {
    if (values.declNo && values.declNo.trim()) {
      return {
        status: "doing",
        guardMessage: "Đã ghi số tờ khai — lưu ý: Đăng ký tờ khai KHÔNG đồng nghĩa đã thông quan"
      };
    }
  }

  // 3. TAX / GNT guard: Tạo GNT != Đã nộp thuế
  if (taskId === "ci-tax") {
    if ((values.gntStatus === "CREATED" || values.gntStatus === "ISSUED") && values.payStatus !== "PAID") {
      return {
        status: "doing",
