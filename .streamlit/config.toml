[server]
maxUploadSize = 200

[browser]
gatherUsageStats = false

[client]
# Hide the Streamlit developer toolbar so the donor-style top header owns the
# header area. (Keyboard shortcuts / rerun remain available.)
toolbarMode = "minimal"

# ---------------------------------------------------------------------------
# LOGISTICS-HYBRID-DESIGN-DONOR: design tokens cloned from logistics-demo.
# Colors: #061024 #0b2545 #123168 #1c4482 #2c5aa0 #2f6fed #1d54c9 #16a34a
#         #d97706 #dc2626 #eef2f8 #ffffff #e2e8f0 #0f1c33 #4b5b72 #8695a8
# Font:   Be Vietnam Pro (system sans-serif fallback when the CDN is blocked)
# ---------------------------------------------------------------------------
[theme]
base = "light"
primaryColor = "#0b2545"
backgroundColor = "#eef2f8"
secondaryBackgroundColor = "#ffffff"
textColor = "#0f1c33"
linkColor = "#1d54c9"
borderColor = "#e2e8f0"
showWidgetBorder = true
baseRadius = "10px"
buttonRadius = "8px"
font = "Be Vietnam Pro:https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap, sans-serif"
headingFont = "Be Vietnam Pro:https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap, sans-serif"
headingFontSizes = ["1.6rem", "1.3rem", "1.1rem", "1rem", "0.95rem", "0.9rem"]
headingFontWeights = [800, 700, 700, 700, 600, 600]
dataframeHeaderBackgroundColor = "#f4f7fc"
dataframeBorderColor = "#e2e8f0"

[theme.sidebar]
backgroundColor = "#0b2545"
secondaryBackgroundColor = "#123168"
textColor = "#e2e8f0"
primaryColor = "#2f6fed"
borderColor = "#1c4482"
linkColor = "#9dc0ff"
