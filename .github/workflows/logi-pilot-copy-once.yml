name: LOGI pilot copy once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/logi-pilot-copy-once.yml

permissions:
  contents: read

jobs:
  pilot-copy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MONGO_URI: ${{ secrets.MONGO_URI }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Mongo dependency
        run: python -m pip install 'pymongo[srv]>=4.10,<5'

      - name: Check secret presence only
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${MONGO_URI:-}" ]; then
            echo 'MONGO_URI_PRESENT=NO'
            exit 2
          fi
          echo 'MONGO_URI_PRESENT=YES'

      - name: Dry run precheck
        shell: bash
        run: |
          set -euo pipefail
          python docs/goals/LOG-LG02/tools/copy_production_to_pilot.py | tee dryrun.log
          grep -Fq 'SOURCE_AUTHORITY_CHECK=PASS' dryrun.log
          grep -Fq 'PILOT_PRECHECK=ABSENT' dryrun.log
          echo 'DRY_RUN_GATE=PASS'

      - name: Execute one-time pilot copy
        shell: bash
        run: |
          set -euo pipefail
          python docs/goals/LOG-LG02/tools/copy_production_to_pilot.py --execute | tee execute.log
          grep -Fq 'SOURCE_MUTATIONS=0' execute.log
          grep -Fq 'VERIFY users in pilot=NO' execute.log
          grep -Fq 'VERIFY notification_outbox in pilot=NO' execute.log
          grep -Fq 'OK: pilot copy complete.' execute.log
          if grep -Fq 'MISMATCH' execute.log; then
            echo 'POST_VERIFY=MISMATCH'
            exit 2
          fi
          echo 'POST_VERIFY=PASS'
