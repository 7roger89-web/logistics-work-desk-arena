name: PR56 Temporary Visual Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  visual-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CANDIDATE_SHA: fb116407e5ac02865348f783c56e90074d736c9b
      MONGO_URI: mongodb://mongomock.local/logistics_staging
      MONGO_DB_NAME: logistics_staging
      MONGO_ALLOWED_DB_NAMES: logistics_staging
      ENV_IDENTITY: PREVIEW
      MONGO_RELEASE_MODE: "false"
      AUTH_REQUIRED: "false"
      GEMINI_API_KEY: ""
      GEMINI_KEYS: "[]"
      DEEPL_API_KEY: ""
      DEEPL_API_KEYS: "[]"
      TELEGRAM_TOKEN: ""
      TELEGRAM_CHAT_ID: ""

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate

      - name: Checkout temporary verifier harness
        uses: actions/checkout@v4
        with:
          ref: preview/pr56-visual-gate-temp
          path: harness

      - name: Verify candidate identity
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          ACTUAL="$(git rev-parse HEAD)"
          echo "CANDIDATE_ACTUAL=$ACTUAL"
          test "$ACTUAL" = "$CANDIDATE_SHA"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime + verifier
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r candidate/requirements.txt playwright pillow
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          echo "CHROME_PATH=$CHROME"

      - name: Start isolated Streamlit preview
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          nohup streamlit run app.py --server.address 127.0.0.1 --server.port 9501 --server.headless true > /tmp/pr56-streamlit.log 2>&1 &
          echo $! > /tmp/pr56-streamlit.pid
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:9501/_stcore/health >/dev/null; then
              echo "STREAMLIT_HEALTH=PASS"
              exit 0
            fi
            sleep 1
          done
          echo "STREAMLIT_HEALTH=FAIL"
          cat /tmp/pr56-streamlit.log
          exit 1

      - name: Real-browser UI UX verification
        shell: bash
        run: |
          set +e
          python harness/tools/pr56_visual_gate_temp.py
          STATUS=$?
          cp /tmp/pr56-streamlit.log /tmp/pr56-visual/streamlit.log || true
          exit $STATUS

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr56-visual-gate-r3-${{ env.CANDIDATE_SHA }}
          path: /tmp/pr56-visual
          if-no-files-found: error
          retention-days: 1
