name: Verify Issue 166 Final

on:
  push:
    branches:
      - ct/issue-166-support-attention-now-fresh-main

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: ct/issue-166-support-attention-now-fresh-main
          fetch-depth: 0

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Focused Issue 166 + bounded regressions
        run: |
          python -m pytest -q             tests/test_support_attention_now_166.py             tests/test_visual_shipment_workspace.py             tests/test_work_module_library_162.py             tests/test_shipment_dashboard.py             tests/test_logi_shipment_primary_action_unify_01.py
