name: Build NotebookLM dist

on:
  push:
    branches:
      - build/notebooklm-dist-20260930

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: component/package-lock.json
      - name: Install component dependencies
        working-directory: component
        run: npm ci
      - name: Typecheck
        working-directory: component
        run: npm run typecheck
      - name: Build component bundle
        working-directory: component
        run: npm run build
      - name: Scan browser bundle
        working-directory: component
        run: npm run scan
      - name: Commit built dist
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add component/dist
          if git diff --cached --quiet; then
            echo "No dist changes"
            exit 0
          fi
          git commit -m "build: refresh component dist for NotebookLM embed"
          git push origin HEAD:${GITHUB_REF_NAME}
