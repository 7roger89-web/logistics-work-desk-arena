name: LOGI disposable browser regression gate (PRE vs FIX)
on:
  push:
    branches:
      - ct/browser-note-qa-gate-20261030
permissions:
  contents: read
jobs:
  pre-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      ENV_IDENTITY: PREVIEW
      MONGO_URI: ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source contracts
        run: |
          python -m py_compile tests/component/g15_split_handle_customer_runtime.py
          node --check tests/component/browser_g15_customer_send_reload.js
          node --check tests/component/browser_g15_lg_tt_smoke.js
          bash -n scripts/qa_journey_note_pre_fix.sh
      - name: Install isolated QA dependencies
        run: |
          python -m pip install -r requirements.txt pytest
          npm install --prefix "$RUNNER_TEMP/pw-cli" --no-audit --no-fund --no-save "@playwright/cli@0.1.22"
          command -v google-chrome
          google-chrome --version
      - name: Execute PRE-FAIL and FIX-PASS on real Chromium
        shell: bash
        run: |
          set -euo pipefail
          export PWCLI_BIN="$RUNNER_TEMP/pw-cli/node_modules/.bin/playwright-cli"
          export PLAYWRIGHT_MCP_EXECUTABLE_PATH="$(command -v google-chrome)"
          export QA_OUT_DIR="$RUNNER_TEMP/logi-note-browser-gate"
          bash scripts/qa_journey_note_pre_fix.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logi-browser-note-pre-fix-20261030
          path: ${{ runner.temp }}/logi-note-browser-gate
          if-no-files-found: warn
          retention-days: 7
