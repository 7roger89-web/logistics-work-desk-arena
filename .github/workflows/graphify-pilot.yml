name: LOGI graphify pilot and PR237 contract verification

on:
  push:
    branches:
      - experiments/graphify-pilot-20261030

permissions:
  contents: read

concurrency:
  group: graphify-pilot-20261030
  cancel-in-progress: true

jobs:
  verify-pr237:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f472274b00cf4849b4837c18d496dfd3dd1e2d33
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt pytest
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing component test dependencies
        run: npm ci --prefix component --no-audit --no-fund
      - name: Recheck exact snapshot and run focused Python contracts
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "f472274b00cf4849b4837c18d496dfd3dd1e2d33"
          python -m pytest tests/test_journey_notes.py tests/test_journey_map_focus.py -q
      - name: Verify three real DOM integration lanes
        run: |
          node tests/component/dom_acceptance_journey_focus_customer.mjs
          node tests/component/dom_acceptance_journey_inline_shell.mjs
          node tests/component/dom_acceptance_journey_focus_shell.mjs

  graphify-code-only:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      GRAPHIFY_BACKEND: none
      GRAPHIFY_QUERY_LOG_DISABLE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f472274b00cf4849b4837c18d496dfd3dd1e2d33
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official pinned Graphify
        run: |
          python -m pip install --disable-pip-version-check "graphifyy==0.9.96"
          graphify --version
      - name: Extract only approved source snapshot (no docs, no LLM, no Cloud)
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "f472274b00cf4849b4837c18d496dfd3dd1e2d33"
          SOURCE="$RUNNER_TEMP/logi_graphify_source"
          OUT="$RUNNER_TEMP/logi_graphify_pilot"
          mkdir -p "$SOURCE" "$OUT"
          for path in \
            core/journey_notes.py \
            core/inbox_attachments.py \
            views/journey_inline.py \
            views/journey_focus.py \
            views/customer_dashboard.py \
            views/logi_view_model.py \
            views/web_app.py \
            assets/customer_portal/hexa-portal.js \
            component/src/components/JourneyMap.tsx \
            component/src/components/JourneyDiscussionPanel.tsx \
            component/src/lib/dispatcher.ts \
            component/src/lib/viewmodel.ts; do
            test -f "$path"
            mkdir -p "$SOURCE/$(dirname "$path")"
            cp "$path" "$SOURCE/$path"
          done
          echo "SOURCE_SHA=f472274b00cf4849b4837c18d496dfd3dd1e2d33"
          find "$SOURCE" -type f | sort
          graphify extract "$SOURCE" --code-only --out "$OUT"
          graphify cluster-only "$OUT" --no-label
          graphify export html --graph "$OUT/graphify-out/graph.json"
          REPORT="$OUT/graphify-out"
          test -s "$REPORT/graph.json"
          test -s "$REPORT/graph.html"
          test -s "$REPORT/GRAPH_REPORT.md"
          python - "$REPORT" <<'PY'
          import json
          import pathlib
          import sys
          root = pathlib.Path(sys.argv[1])
          graph = json.loads((root / "graph.json").read_text(encoding="utf-8"))
          nodes = graph.get("nodes", [])
          edges = graph.get("edges", graph.get("links", []))
          keywords = ["journey", "download", "attachment", "customer", "note", "focus"]
          matched = [n for n in nodes if any(k in str(n.get("label", "")).lower() for k in keywords)]
          lines = [
              "SOURCE_SHA=f472274b00cf4849b4837c18d496dfd3dd1e2d33",
              "GRAPHIFY_VERSION=0.9.96",
              f"NODES={len(nodes)}",
              f"EDGES={len(edges)}",
              f"MATCHING_NODES={len(matched)}",
          ]
          lines.extend(
              f"NODE {n.get('label', '')} | {n.get('source_file', '')}"
              for n in matched[:60]
          )
          (root / "pilot-summary.txt").write_text("\n".join(lines) + "\n", encoding="utf-8")
          print("\n".join(lines))
          if not nodes or not edges:
              raise SystemExit("GRAPHIFY_EMPTY_GRAPH")
          PY
      - name: Upload real Graphify output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graphify-pilot-20261030
          path: ${{ runner.temp }}/logi_graphify_pilot/graphify-out/
          retention-days: 7
          if-no-files-found: warn

  browser-streamlit-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      MONGO_URI: ''
      ENV_IDENTITY: STAGING
      BROWSER_URL: http://127.0.0.1:9501
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the app implementation is the unchanged PR237 snapshot
        run: git diff --exit-code f472274b00cf4849b4837c18d496dfd3dd1e2d33 -- core views assets component
      - name: Install isolated test dependencies + browser driver
        run: |
          python -m pip install -r requirements.txt playwright
          google-chrome --version
      - name: Start isolated actual Streamlit v2 runtime
        run: |
          mkdir -p test-results/graphify-journey-browser
          python -m streamlit run tests/experiments/qa_journey_inline_host.py --server.port=9501 --server.address=127.0.0.1 --server.headless=true > test-results/graphify-journey-browser/streamlit.log 2>&1 &
          echo $! > test-results/graphify-journey-browser/server.pid
          for i in $(seq 1 70); do
            if curl -fsS http://127.0.0.1:9501/_stcore/health; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:9501/_stcore/health
      - name: Actual Chromium desktop/mobile and PNG/PDF roundtrip
        run: python tests/experiments/qa_journey_inline_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: journey-actual-streamlit-browser-qa
          path: test-results/graphify-journey-browser/
          retention-days: 7
          if-no-files-found: warn
