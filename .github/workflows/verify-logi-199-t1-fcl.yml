name: LOGI-199 T1 SEA FCL equipment regression

on:
  push:
    branches:
      - ct/logi199-t1-fcl-multi-container-truth
      - ct/logi199-t1-fcl-lifecycle-truth
      - ct/logi199-t2-t4-mode-truth
      - ct/logi199-t5-app-identity

permissions:
  contents: read

concurrency:
  group: logi199-t1-fcl-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fcl-equipment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing project requirements and pytest
        run: python -m pip install -r requirements.txt pytest
      - name: FCL multi-container regression and existing execution profile
        run: |
          python -m pytest tests/test_logi199_t1_sea_fcl_equipment.py tests/test_logi199_t1_sea_fcl_lifecycle.py tests/test_logi199_t2_t4_mode_truth.py tests/test_logi199_t5_popup_fields.py tests/test_visual_shipment_workspace.py tests/test_journey_v3_customs_import_184.py tests/test_journey_fresh_parity_188.py tests/test_journey_super_goal_186.py tests/test_work_module_library_162.py tests/test_logi_shipment_execution_profile_01.py -q
      - name: Reject any generated writer or production secrets
        run: |
          test ! -e .streamlit/secrets.toml
          git diff --exit-code -- core/shipment_execution_profile.py
  react-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Typecheck and rebuild official Vite bundle; committed dist must match
        working-directory: component
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build
          git diff --exit-code -- dist
