name: LOGI-199 T1 SEA FCL equipment regression

on:
  push:
    branches:
      - ct/logi199-t1-fcl-multi-container-truth

permissions:
  contents: read

concurrency:
  group: logi199-t1-fcl-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fcl-equipment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing project requirements and pytest
        run: python -m pip install -r requirements.txt pytest
      - name: FCL multi-container regression and existing execution profile
        run: |
          python -m pytest tests/test_logi199_t1_sea_fcl_equipment.py tests/test_logi_shipment_execution_profile_01.py -q
      - name: Reject any generated writer or production secrets
        run: |
          test ! -e .streamlit/secrets.toml
          git diff --exit-code -- core/shipment_execution_profile.py
