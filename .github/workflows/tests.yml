name: tests

# Bộ test "đỏ có chủ ý": pytest luôn trả exit 1 khi còn known-red, nên bước
# pytest được continue-on-error và scripts/check_known_red.py là gate quyết định.
# Quy tắc: FAILED/ERROR mới => gate đỏ; known-red nay pass => DRIFT (xanh, cảnh báo).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  known-red-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies (pinned lock; requirements.txt stays the range source)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Run pytest (known-red được dự kiến; gate ở bước kế tiếp quyết định)
        continue-on-error: true
        run: python -m pytest tests -q --continue-on-collection-errors --junitxml=report.xml

      - name: Known-red gate
        run: python scripts/check_known_red.py --junit report.xml --registry tests/known_red.txt

      - name: Upload junit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: report.xml
          if-no-files-found: warn
