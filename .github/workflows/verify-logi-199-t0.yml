name: Verify LOGI-199 T0 source and build

on:
  push:
    branches:
      - ct/logi-app-renewal-01-t0-air-truth

permissions:
  contents: read

concurrency:
  group: logi-199-t0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  t0:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR 200 branch without production secrets
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install current project Python requirements and pytest
        run: python -m pip install -r requirements.txt pytest

      - name: Verify AIR documents, visual source, and existing profile regression
        run: python -m pytest tests/test_logi_goal199_air_documents.py tests/test_logi_goal199_visual_source.py tests/test_logi_shipment_execution_profile_01.py -q

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: component/package-lock.json

      - name: Official component lockfile, typecheck, build and executable scan
        working-directory: component
        run: |
          npm ci
          npm run typecheck
          npm run build
          npm run scan

      - name: Hand off only verified build assets
        uses: actions/upload-artifact@v4
        with:
          name: logi-199-t0-dist
          path: |
            component/dist/logi-shell.js
            component/dist/logi-shell.css
          if-no-files-found: error
          retention-days: 1

  commit-dist:
    name: Sync reviewed build onto draft PR branch
    needs: t0
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: write
    steps:
      - name: Checkout exact bounded PR branch
        uses: actions/checkout@v4
        with:
          ref: ct/logi-app-renewal-01-t0-air-truth
          fetch-depth: 1

      - name: Download build artifacts from successful read-only verification
        uses: actions/download-artifact@v4
        with:
          name: logi-199-t0-dist
          path: component/dist

      - name: Commit only the two production-loaded bundle files
        run: |
          git add component/dist/logi-shell.js component/dist/logi-shell.css
          if git diff --cached --quiet; then
            echo "DIST_SYNC=ALREADY_CURRENT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build(LOGI-199): sync verified T0 dist [skip ci]"
            git push origin HEAD:ct/logi-app-renewal-01-t0-air-truth
            echo "DIST_SYNC=COMMITTED"
          fi
