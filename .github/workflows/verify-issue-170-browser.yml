name: Verify Issue 170 Browser

on:
  push:
    branches:
      - ct/issue-170-operations-control-tower-v1

permissions:
  contents: write

jobs:
  browser:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: ct/issue-170-operations-control-tower-v1
          fetch-depth: 0

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: component/package-lock.json

      - name: Install frontend lockfile
        working-directory: component
        run: npm ci

      - name: Typecheck and rebuild shipped bundle
        working-directory: component
        run: |
          npm run typecheck
          npm run build
          npm run scan

      - name: Install isolated Playwright Chromium
        run: |
          npm install --prefix /tmp/pw --package-lock=false playwright@1.56.1
          PLAYWRIGHT_BROWSERS_PATH=/tmp/pw-browsers /tmp/pw/node_modules/.bin/playwright install --with-deps chromium

      - name: Real-browser Issue 170 acceptance
        env:
          PLAYWRIGHT_MODULE: /tmp/pw/node_modules/playwright/index.mjs
          PLAYWRIGHT_BROWSERS_PATH: /tmp/pw-browsers
        run: |
          rm -rf evidence/170
          node tests/component/browser_operations_control_tower_170.mjs evidence/170

      - name: Commit browser evidence and rebuilt dist
        run: |
          git add evidence/170 component/dist
          if git diff --cached --quiet; then
            echo "EVIDENCE_OR_DIST_CHANGED=NO"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "test: record issue 170 browser evidence"
            git push origin HEAD:ct/issue-170-operations-control-tower-v1
            echo "EVIDENCE_OR_DIST_CHANGED=YES"
          fi
